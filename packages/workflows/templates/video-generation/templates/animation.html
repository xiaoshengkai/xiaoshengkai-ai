<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; }
#stage { position: relative; overflow: hidden; }
.clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; text-align: center; opacity: 0; overflow: hidden; word-break: break-word; }
.clip > * { max-width: 100%; flex-shrink: 1; min-width: 0; }
.clip img, .clip svg { max-width: 100% !important; max-height: 60% !important; height: auto; }
.clip table { font-size: clamp(10px, 2.5cqw, 20px); width: 100% !important; table-layout: fixed; }
.clip td, .clip th { padding: 2px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* AI 在此处扩展样式 */
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">
  <!-- AI 在此处填充场景 -->
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
(function() {
  var clips = document.querySelectorAll('.clip');
  if (clips.length === 0) return;
  var tl = gsap.timeline({ paused: true });
  var startAccum = 0;
  clips.forEach(function(s) {
    var start = parseFloat(s.getAttribute('data-start'));
    if (isNaN(start)) start = startAccum;
    var dur = parseFloat(s.getAttribute('data-duration')) || 4;
    startAccum = start + dur;
    tl.set(s, { opacity: 0 }, start);
    tl.to(s, { opacity: 1, duration: 0.5 }, start);
    tl.to(s, { opacity: 0, duration: 0.3 }, start + dur - 0.3);
  });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  window.addEventListener('load', function() { tl.play(); });
})();
</script>
</body>
</html>
